
<!DOCTYPE html>
<html>
<head>
    <title>Car Sales Forecast</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f5f7fa; color: #243247; max-width: 600px; margin: 60px auto; padding: 0 20px; }
        h1 { color: #245b7a; }
        input { font: inherit; padding: 8px; border: 1px solid #b8c8d4; border-radius: 4px; }
        button { font: inherit; color: white; background: #245b7a; border: 0; border-radius: 4px; padding: 10px 18px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Car Sales Forecast</h1>
    <p>Enter sales from the previous 6 months.</p>

    <!-- input boxes for each month -->
    <input type="number" id="lag1" placeholder="Last month" min="0" step="any" required><br><br>
    <input type="number" id="lag2" placeholder="2 months ago" min="0" step="any" required><br><br>
    <input type="number" id="lag3" placeholder="3 months ago" min="0" step="any" required><br><br>
    <input type="number" id="lag4" placeholder="4 months ago" min="0" step="any" required><br><br>
    <input type="number" id="lag5" placeholder="5 months ago" min="0" step="any" required><br><br>
    <input type="number" id="lag6" placeholder="6 months ago" min="0" step="any" required><br><br>

    <!-- button to run prediction -->
    <button onclick="predict()">PREDICT!</button>

    <!-- where our result will appear -->
    <h2 id="result"></h2>

    <script>
        async function predict() {

            // get the 6 numbers entered by the user
            let sales = [];

            for (let i = 1; i <= 6; i++) {
                let value = document.getElementById("lag" + i).value;

                // check that all 6 inputs are nonnegative numbers (can be floats or ints)
                if (value === "" || !Number.isFinite(Number(value)) || Number(value) < 0) {
                    document.getElementById("result").innerText =
                        "Please enter 6 valid nonnegative numbers.";
                    return;
                }

                sales.push(Number(value));
            }

            // send the numbers to fastapi
            let response = await fetch("/predict", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({sales: sales})
            });

            // read the prediction returned by fastapi
            let data = await response.json();

            // display the prediction
            document.getElementById("result").innerText =
                "PREDICTED SALES BY JULIE'S MODEL (warning: this model is NOT accurate...): " + Math.round(data.prediction);
        }
    </script>

</body>
</html>
